<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affeira</title>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 0;
            background-color: #1E7D22; /* Verde similar */
            font-family: 'Comfortaa', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
        }

        /* Texto principal */
        .bienvenida {
            font-size: 80px;
            color: #F5F12B; /* Amarillo vibrante */
            font-weight: 500;
            margin: 0;
        }

        /* Eslogan */
        .slogan {
            font-size: 20px;
            color: #F5F12B;
            margin-top: 5px;
        }

        /* Botón */
        .boton {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background-color: #F5F12B;
            color: #1E7D22;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .boton:hover {
            background-color: #FFD700;
            transform: scale(1.05);
        }
    </style>
        <link href="https://fonts.googleapis.com/css2?family=Material+Icons&family=Material+Icons+Outlined&family=Material+Icons+Round" rel="stylesheet">

</head>
<body>

    <p class="bienvenida">affeira</p>
    <p class="slogan">just ask</p>

    <button class="boton">ENTER AFFEIRA</button>
    <h2>Íconos sin errores 🎯</h2>

    <div class="icon-container">
        <!-- Ícono de búsqueda (Regular) -->
        <span class="material-icons icon search">search</span>

        <!-- Ícono de usuario (Outlined) -->
        <span class="material-icons-outlined icon user">person</span>

        <!-- Ícono de menú hamburguesa (Round) -->
        <span class="material-icons-round icon menu">menu</span>
    </div>


</body>
</html>
